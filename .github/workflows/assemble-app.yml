name: Assemble standalone app

on:
  push:
    paths:
      - "source-chunks/**"
      - ".github/workflows/assemble-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble original HTML
        run: |
          cat source-chunks/index.html.part-* > index.html
          test -s index.html
      - name: Commit assembled app
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Build standalone Неотложка+ application"
            git push
          fi
